name: Build unstable APK

on:
  workflow_dispatch:
    inputs:
      gradle-task:
        description: 'Gradle task to run'
        required: false
        default: 'assembleUnstableRelease'
        type: choice
        options:
          - assembleUnstableRelease
          - assembleUnstableDebug

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: versionCode/versionName fall back to
          # git rev-list / git describe when env vars are unset.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.gradle-task }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-unstable-apk
          path: build/outputs/apk/unstable/release/*.apk
