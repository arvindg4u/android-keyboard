name: Release stable APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Restore release keystore (optional)
        # Same secret names as voice-ime-android so one key serves both
        # repos. If absent, this step is a no-op and the build falls back
        # to the debug signing config, same as local builds without
        # keystore.properties.
        env:
          VOICEIME_KEYSTORE_B64: ${{ secrets.VOICEIME_KEYSTORE_B64 }}
          VOICEIME_STORE_PASSWORD: ${{ secrets.VOICEIME_STORE_PASSWORD }}
          VOICEIME_KEY_ALIAS: ${{ secrets.VOICEIME_KEY_ALIAS }}
          VOICEIME_KEY_PASSWORD: ${{ secrets.VOICEIME_KEY_PASSWORD }}
        run: |
          if [ -n "$VOICEIME_KEYSTORE_B64" ]; then
            echo "$VOICEIME_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$VOICEIME_STORE_PASSWORD"
              echo "keyAlias=$VOICEIME_KEY_ALIAS"
              echo "keyPassword=$VOICEIME_KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore restored."
          else
            echo "No VOICEIME_KEYSTORE_B64 secret; using debug signing."
          fi

      - name: Resolve version from tag
        # Tag checkouts are detached HEAD with no local master branch, so
        # build.gradle's git fallbacks fail (versionCode -1). Pass explicit
        # values instead, same release-tag-as-version scheme as always.
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=master" >> "$GITHUB_ENV"

      - name: Run voiceinput-shared unit tests
        run: |
          chmod +x gradlew
          ./gradlew :voiceinput-shared:testDebugUnitTest --stacktrace

      - name: Build stable release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls build/outputs/apk/stable/release/*.apk | head -n 1)
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/stable/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
