name: Release stable APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Restore release keystore (optional)
        # If KEYSTORE_B64 secrets are absent (first release), this step is a
        # no-op and the build falls back to the debug signing config, same
        # as local builds without keystore.properties.
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/release.keystore"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release keystore restored."
          else
            echo "No KEYSTORE_B64 secret; using debug signing."
          fi

      - name: Run voiceinput-shared unit tests
        run: |
          chmod +x gradlew
          ./gradlew :voiceinput-shared:testDebugUnitTest --stacktrace

      - name: Build stable release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls build/outputs/apk/stable/release/*.apk | head -n 1)
          echo "APK=$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/stable/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
